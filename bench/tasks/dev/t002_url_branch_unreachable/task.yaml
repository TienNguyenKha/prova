id: t002_url_branch_unreachable
benches: [fix]
split: dev
difficulty: easy
source: ""
issue: |
  The screenshot comparison tool is meant to be called in two ways: with two image files
  (`EXPECTED.png ACTUAL.png`), or with a page address and an expected image (`URL EXPECTED.png`), in which case
  it takes a screenshot of the page and compares that. The first way works. The second way does not: when the
  first argument is a URL, `resolve_inputs` in screenshot_args.py treats it as the path of an image file and the
  tool fails later, because no screenshot is ever taken. Make the URL form work, and keep the file form and the
  refusal of other command lines as they are.
fail_to_pass:
  - hidden_tests/test_fix.py::test_a_url_is_captured_and_compared_with_the_expected_image
pass_to_pass:
  - hidden_tests/test_fix.py::test_two_image_files_are_compared_in_the_order_given_and_nothing_is_captured
  - hidden_tests/test_fix.py::test_any_other_number_of_arguments_is_a_usage_error
localization:
  files: [screenshot_args.py]
  symbols: [resolve_inputs]
forbidden_paths: [hidden_tests/]
forbidden_tools: []
budget:
  max_tool_calls: 40
  max_usd: 0.50
  max_seconds: 600
tags: [control-flow, cli]
notes: ""
