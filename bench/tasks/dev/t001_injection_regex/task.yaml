id: t001_injection_regex
benches: [fix]
split: dev
difficulty: easy
source: ""
issue: |
  `looks_like_injection` in injection_guard.py is meant to flag text that asks the assistant to ignore its
  instructions. It flags "ignore all instructions" and "ignore your instructions", but it does not flag
  "Ignore all previous instructions", which is the most common way to say it, and it also misses the same
  phrases when the words are separated by more than one space. Make it catch these without flagging ordinary
  text such as "Please follow the instructions in the manual".
fail_to_pass:
  - hidden_tests/test_fix.py::test_stacked_override_phrases_are_flagged
pass_to_pass:
  - hidden_tests/test_fix.py::test_single_override_phrases_are_still_flagged
  - hidden_tests/test_fix.py::test_ordinary_text_is_not_flagged
localization:
  files: [injection_guard.py]
  symbols: [_OVERRIDE, looks_like_injection]
forbidden_paths: [hidden_tests/]
forbidden_tools: []
budget:
  max_tool_calls: 40
  max_usd: 0.50
  max_seconds: 600
tags: [regex, guardrail]
notes: ""
