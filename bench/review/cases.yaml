# Patches for measuring a reviewer (M14): does it block the bad ones and let the good ones through?
# The truth comes from the hidden tests of each task: a `good` patch passes all of them, a `bad` one fails at
# least one. `python -m bench.review_cases` checks this in the sandbox (no model, no money).
# `patch: reference` is the task's reference.patch; anything else is a file in bench/review/patches/.
version: 1
cases:
  # -- good: the reference patch of every task ---------------------------------------------------------
  - {id: t001-reference, task: t001_injection_regex, patch: reference, label: good, kind: reference}
  - {id: t002-reference, task: t002_url_branch_unreachable, patch: reference, label: good, kind: reference}
  - {id: t006-reference, task: t006_fail_open_classifier, patch: reference, label: good, kind: reference}
  - {id: t009-reference, task: t009_fail_open_review, patch: reference, label: good, kind: reference}
  - {id: t011-reference, task: t011_nightly_reminder, patch: reference, label: good, kind: reference}
  - {id: t014-reference, task: t014_command_allowlist, patch: reference, label: good, kind: reference}
  - {id: t015-reference, task: t015_path_traversal, patch: reference, label: good, kind: reference}
  - {id: t016-reference, task: t016_ssrf_guard, patch: reference, label: good, kind: reference}

  # -- bad: plausible fixes that are wrong ---------------------------------------------------------------
  - id: t001-too-broad
    task: t001_injection_regex
    patch: t001_injection_regex-too_broad.patch
    label: bad
    kind: overreach
    note: 'the regex "ignore.*instructions" also flags text that only mentions the phrase (as in a real run)'
  - id: t006-closed-on-bad-json-only
    task: t006_fail_open_classifier
    patch: t006_fail_open_classifier-closed_on_bad_json_only.patch
    label: bad
    kind: partial
    note: fails closed on bad JSON, but a fenced reply is blocked and a reply that is not an object still raises
  - id: t009-symptom-only
    task: t009_fail_open_review
    patch: t009_fail_open_review-symptom_only.patch
    label: bad
    kind: overfit_visible
    note: fixes the unreachable reviewer that the visible test shows; unreadable replies still raise
  - id: t011-remembered-in-memory
    task: t011_nightly_reminder
    patch: t011_nightly_reminder-remembered_in_memory.patch
    label: bad
    kind: overfit_visible
    note: remembers reminded issues in a module variable, lost on the next night's process, blind to comments
  - id: t014-semicolon-only
    task: t014_command_allowlist
    patch: t014_command_allowlist-semicolon_only.patch
    label: bad
    kind: overfit_visible
    note: blocks ";" only; "&&", "|", "$(...)", new lines and empty commands get through or raise
  - id: t014-hardcoded-visible-case
    task: t014_command_allowlist
    patch: t014_command_allowlist-hardcoded_visible_case.patch
    label: bad
    kind: hardcoded
    note: refuses exactly the command of the visible test and nothing else
  - id: t015-sibling-only
    task: t015_path_traversal
    patch: t015_path_traversal-sibling_only.patch
    label: bad
    kind: partial
    note: compares whole path parts, so the sibling folder is caught, but links are not followed
  - id: t015-links-only
    task: t015_path_traversal
    patch: t015_path_traversal-links_only.patch
    label: bad
    kind: partial
    note: follows links with realpath, but still compares text, so the sibling folder gets through
  - id: t016-is-global-only
    task: t016_ssrf_guard
    patch: t016_ssrf_guard-is_global_only.patch
    label: bad
    kind: partial
    note: trusts ipaddress.is_global, which is True for multicast (224.0.0.1)
  - id: t016-private-blocklist
    task: t016_ssrf_guard
    patch: t016_ssrf_guard-private_blocklist.patch
    label: bad
    kind: partial
    note: a list of private ranges misses CGNAT (100.64.0.0/10) and multicast
