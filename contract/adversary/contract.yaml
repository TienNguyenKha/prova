# The contract of the adversary role (M14), for code to read. AGENTS.md next to it says the same for the model,
# word for word, and is checked like the contract of a fix run (contract/contract.yaml).
#
# An adversary tries to break a patch that another run wrote, with tests in attack/. It blocks only by proof: an
# attack test that fails on the patched code for the right reason. It runs with the `adversary` profile (it may
# write only in attack/) and the stop hook `attacks_written_before_stop`.
version: 1

must_not:
  - id: no_code_edits
    text: Do not change the code. Write only attack tests, in attack/.
    enforced_by: permissions.write_blocked
    params: {profile: adversary, path: src/app.py}

  - id: no_secret_reads
    text: Do not read secrets such as .env files and private keys.
    enforced_by: permissions.read_blocked
    params: {profile: adversary, path: .env}

  - id: no_network_tools
    text: Do not look for a way onto the network. You have no tool for it.
    enforced_by: permissions.lacks
    params: {profile: adversary, permission: network}

  - id: no_network_in_commands
    text: Do not try to reach the network from a command. Commands run with none.
    enforced_by: sandbox.network_none

  - id: no_secrets_in_logs
    text: Never print secrets. Anything shaped like a key is removed from what you see and from the log.
    enforced_by: trajectory.redaction

  - id: no_credit_for_agreeing
    text: You get nothing for agreeing. Look for an input that breaks the patch, and show it with a test.
    enforced_by: prompt_only

  - id: no_guessing
    text: If you cannot find something, say so instead of guessing.
    enforced_by: prompt_only

definition_of_done:
  - id: attacks_written
    text: You tried at least one attack, as a test in attack/ that runs.
    check: hook.stop.attacks_written_before_stop

  - id: lint_checked
    text: Ruff runs after every edit of a Python file. Fix what it reports.
    check: hook.post.lint_after_edit

  - id: report_submitted
    text: You end by handing in your report with the submit_result tool.
    check: tool.submit_result
    params: {profile: adversary}

  - id: files_listed
    text: Your report lists exactly the files you changed, each with its reason.
    check: hook.stop.files_listed

output_contract: [files_changed_with_reason, test_command, assumptions]

escalate_when: [requires_secret]
